name: translate-locale
description: "Translate a key-value localization file into another language, a handful of entries at a time. The model only ever translates one chunk — chunking, looping, and writing are handled deterministically by the framework, working with parsed JSON entries rather than raw text so the model never has to hand-produce JSON syntax."

stages:

  # -------------------------------------------------------------------------
  # Stage 1: Parse — extract source path, output path, target language from the request
  # -------------------------------------------------------------------------
  - name: parse_request
    type: llm
    system_prompt: |
      You extract three fields from the user's request: the source file path, the output file path,
      and the target language. Do not translate anything here — only extract these fields.
      - target_language: the language the user asked to translate INTO.
      - output_path: if the user did not give one, derive it from the source path by swapping the
        language code in the filename for the target language's ISO 639-1 code (e.g. en.json +
        German -> de.json), in the same directory as the source file.
      You MUST call finish_parse_request. Do not write a text response — call the tool instead.
    user_prompt: "{{user_message}}"
    tools: []
    finish_tool: finish_parse_request
    max_iterations: 2

  # -------------------------------------------------------------------------
  # Stage 2: Create the output file (single user confirmation for the whole run)
  # -------------------------------------------------------------------------
  - name: init_output
    type: llm
    system_prompt: |
      Create an empty file at the exact path given in the user prompt, using write_file with empty content.
      If write_file reports the file already exists, that is fine — treat it as success, do not use edit_file,
      do not read or modify the existing content.
      Call finish_task with status "success" either way.
    user_prompt: "Output file path: {{parse_request.output_path}}"
    tools: [write_file]
    finish_tool: finish_task
    max_iterations: 3

  # -------------------------------------------------------------------------
  # Coordinator: parse the source file and split it into fixed-size groups of entries
  # (deterministic, no model) — the model only ever sees clean {key, value} objects, never raw
  # JSON text it has to reproduce byte-for-byte.
  # -------------------------------------------------------------------------
  - name: split
    type: coordinator
    action: chunk_json_entries
    input:
      path: "{{parse_request.source_path}}"
    output: chunks

  # -------------------------------------------------------------------------
  # Stage 3: Translate loop — one chunk per iteration, translate only, append only
  # -------------------------------------------------------------------------
  - name: translate_loop
    type: loop
    over: "{{chunks}}"
    item_var: chunk
    max_retries: 10
    on_max_retries: continue
    exit_condition: "append_chunk.success"
    output: translate_results

    stages:
      - name: translate_chunk
        type: llm
        system_prompt: |
          You are localizing a JSON translation file. You will be given a list of entries, each with:
          - key: a French lookup identifier used by the application code
          - value: the message in the source language, shown to the user

          The key and the value express the SAME message in two different languages.

          For every entry, write the SAME message as `value`, in {{parse_request.target_language}}.
          Read both the key and the value to be sure of the meaning before translating.

          Example, when the target language is German:
              input:  {"key": "Se connecter", "value": "Log in"}
              output: {"key": "Se connecter", "translated_value": "Anmelden"}

          Note in that example: only the value changed — from English to the target language. Never
          write translated_value in French, and never leave it in English (unless
          {{parse_request.target_language}} is French or English respectively).

          Keep placeholders such as {name}, %s, %d and any HTML tags exactly as they appear in the
          translated value.

          Submit one output entry per input entry, in the same order, by calling
          finish_translate_chunk: copy each entry's key back as given (this just helps you stay on
          the right entry as you go — it is not what identifies the entry when saved), and set
          translated_value to the message rewritten in {{parse_request.target_language}}.

          Before answering, check every translated_value is actually in
          {{parse_request.target_language}}, and that you produced exactly one output entry per
          input entry.
          You MUST call finish_translate_chunk. Do not write a text response — call the tool instead.
        user_prompt: |
          Translate the value of each entry below into {{parse_request.target_language}}. Return one
          output entry per input entry, in the same order.

          {{chunk.entries}}
        tools: []
        finish_tool: finish_translate_chunk
        max_iterations: 2

      - name: append_chunk
        type: coordinator
        action: append_json_entries
        input:
          path: "{{parse_request.output_path}}"
          entries: "{{translate_chunk.entries}}"
          keys: "{{chunk.keys}}"
        output: append_chunk

  # -------------------------------------------------------------------------
  # Stage 4: Synthesis — report completion
  # -------------------------------------------------------------------------
  - name: synthesis
    type: respond
    message_suffix: |
      [Translation complete. {{chunks | length}} chunks translated from {{parse_request.source_path}}
      to {{parse_request.target_language}}, written to {{parse_request.output_path}}.]

      Tell the user the translation finished and where the output file is.

finish_tools:
  finish_parse_request:
    description: "Submit the extracted source path, output path, and target language."
    parameters:
      source_path:
        type: string
        description: "Path to the source localization file, relative to the workspace."
      output_path:
        type: string
        description: "Path to write the translated file to, relative to the workspace."
      target_language:
        type: string
        description: "The target language to translate into (e.g. German, Dutch)."

  finish_translate_chunk:
    description: "Submit the translated entries for this chunk, one per input entry, in the same order."
    parameters:
      entries:
        type: array
        description: "One object per input entry, in the same order the input entries were given."
        items:
          type: object
          properties:
            key:
              type: string
              description: "Copy the input entry's key, so you stay aligned to the right entry while translating."
            translated_value:
              type: string
              description: "The entry's value, rewritten in the target language."
          required: [key, translated_value]
