name: translate-locale
description: "Translate a key-value localization file into another language, 40 lines at a time. The model only ever translates one chunk — chunking, looping, and writing are handled deterministically by the framework."

stages:

  # -------------------------------------------------------------------------
  # Stage 1: Parse — extract source path, output path, target language from the request
  # -------------------------------------------------------------------------
  - name: parse_request
    type: llm
    system_prompt: |
      You extract three fields from the user's request: the source file path, the output file path,
      and the target language. Do not translate anything here — only extract these fields.
      - target_language: the language the user asked to translate INTO.
      - output_path: if the user did not give one, derive it from the source path by swapping the
        language code in the filename for the target language's ISO 639-1 code (e.g. en.json +
        German -> de.json), in the same directory as the source file.
      You MUST call finish_parse_request. Do not write a text response — call the tool instead.
    user_prompt: "{{user_message}}"
    tools: []
    finish_tool: finish_parse_request
    max_iterations: 2

  # -------------------------------------------------------------------------
  # Stage 2: Create the output file (single user confirmation for the whole run)
  # -------------------------------------------------------------------------
  - name: init_output
    type: llm
    system_prompt: |
      Create an empty file at the exact path given in the user prompt, using write_file with empty content.
      If write_file reports the file already exists, that is fine — treat it as success, do not use edit_file,
      do not read or modify the existing content.
      Call finish_task with status "success" either way.
    user_prompt: "Output file path: {{parse_request.output_path}}"
    tools: [write_file]
    finish_tool: finish_task
    max_iterations: 3

  # -------------------------------------------------------------------------
  # Coordinator: split the source file into fixed-size line chunks (deterministic, no model)
  # -------------------------------------------------------------------------
  - name: split
    type: coordinator
    action: chunk_file
    input:
      path: "{{parse_request.source_path}}"
    output: chunks

  # -------------------------------------------------------------------------
  # Stage 3: Translate loop — one chunk per iteration, translate only, append only
  # -------------------------------------------------------------------------
  - name: translate_loop
    type: loop
    over: "{{chunks}}"
    item_var: chunk
    max_retries: 10
    on_max_retries: continue
    output: translate_results

    stages:
      - name: translate_chunk
        type: llm
        system_prompt: |
          You are localizing a JSON translation file. Every line has this shape:

              "french text": "english text",

          The KEY (left of the colon) is a French lookup identifier used by the application code.
          The VALUE (right of the colon) is the English message shown to the user.
          The key and the value express the SAME message in two different languages.

          For every line, do exactly two things:
          1. Copy the KEY byte-for-byte. Never translate it, reword it, or change its casing.
             It is an identifier — changing it breaks the application.
          2. Replace the VALUE with that same message written in {{parse_request.target_language}}.
             Read both the French key and the English value to be sure of the meaning, then write
             it in {{parse_request.target_language}}.

          Example, when the target language is German:
              input line:   "Se connecter": "Log in",
              output line:  "Se connecter": "Anmelden",

          Note in that example: the key stayed French, and only the value changed — from English to
          the target language. Never write the value in French, and never leave it in English
          (unless {{parse_request.target_language}} is French or English respectively).

          Rules — this output is written to disk unmodified:
          - One line in, one line out. Keep line order, indentation, quotes, colons, commas and
            braces exactly as they appear.
          - Keep placeholders such as {name}, %s, %d and any HTML tags exactly as they appear.
          - If a line has no key/value pair (e.g. a lone brace), copy it unchanged.
          - Output only the transformed lines — no commentary, no markdown fences, no line numbers.

          Before answering, check that every VALUE you wrote is in {{parse_request.target_language}}
          and every KEY is unchanged.
          You MUST call finish_translate_chunk. Do not write a text response — call the tool instead.
        user_prompt: |
          Rewrite the value of each line below into {{parse_request.target_language}}, keeping every
          key unchanged. Return only the rewritten lines.

          {{chunk.text}}
        tools: []
        finish_tool: finish_translate_chunk
        max_iterations: 2

      - name: append_chunk
        type: coordinator
        action: append_text
        input:
          path: "{{parse_request.output_path}}"
          text: "{{translate_chunk.translated_text}}"

  # -------------------------------------------------------------------------
  # Stage 4: Synthesis — report completion
  # -------------------------------------------------------------------------
  - name: synthesis
    type: respond
    message_suffix: |
      [Translation complete. {{chunks | length}} chunks translated from {{parse_request.source_path}}
      to {{parse_request.target_language}}, written to {{parse_request.output_path}}.]

      Tell the user the translation finished and where the output file is.

finish_tools:
  finish_parse_request:
    description: "Submit the extracted source path, output path, and target language."
    parameters:
      source_path:
        type: string
        description: "Path to the source localization file, relative to the workspace."
      output_path:
        type: string
        description: "Path to write the translated file to, relative to the workspace."
      target_language:
        type: string
        description: "The target language to translate into (e.g. German, Dutch)."

  finish_translate_chunk:
    description: "Submit the translated chunk text, ready to be appended to the output file unmodified."
    parameters:
      translated_text:
        type: string
        description: "The chunk with only the string values translated. Same line count, same structure as the input."
